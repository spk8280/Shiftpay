<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2c42"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ShiftPay"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><title>ShiftPay</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>ShiftPay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone app — payday hero, today strip, paystub-style period card, shift calendar, outlook; setup wizard and day editor as sheets */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#111821; --muted:#5b6574; --line:#e0e4ea; --chip:#edf0f3;
  --hero:#0e2c42; --hero-ink:#ffffff; --hero-muted:#a6bccd; --hero-line:rgba(255,255,255,.14);
  --accent:#1e5fd0; --accent-ink:#ffffff; --accent-soft:#e3ebfa;
  --work:#1e5fd0; --work-soft:#e1e9f9; --ot:#b35f00; --ot-soft:#fcebd6; --pto:#22804f; --pto-soft:#dcf0e4;
  --hol:#b0306f; --hol-soft:#f8e0ec; --off:#8b95a3; --un:#7a5642; --pay:#14996b; --pay-soft:#d9f3e9; --period:#f5f8fc; --err:#c0362c;
  --f-display:"Manrope","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Manrope","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f14; --surface:#151b22; --ink:#e7ecf2; --muted:#98a3b1; --line:#262f39; --chip:#1d242c;
  --hero:#123a57; --hero-ink:#ffffff; --hero-muted:#a9c3d6; --hero-line:rgba(255,255,255,.14);
  --accent:#72a6f5; --accent-ink:#06193a; --accent-soft:#172741;
  --work:#72a6f5; --work-soft:#182740; --ot:#f2a75a; --ot-soft:#3b2814; --pto:#69c693; --pto-soft:#14301f;
  --hol:#ee8abd; --hol-soft:#3b1a2b; --off:#6b7583; --un:#c9a089; --pay:#4fd3a2; --pay-soft:#12352a; --period:#111821; --err:#f28a80;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#151b22; --ink:#e7ecf2; --muted:#98a3b1; --line:#262f39; --chip:#1d242c;
  --hero:#123a57; --hero-ink:#ffffff; --hero-muted:#a9c3d6; --hero-line:rgba(255,255,255,.14);
  --accent:#72a6f5; --accent-ink:#06193a; --accent-soft:#172741;
  --work:#72a6f5; --work-soft:#182740; --ot:#f2a75a; --ot-soft:#3b2814; --pto:#69c693; --pto-soft:#14301f;
  --hol:#ee8abd; --hol-soft:#3b1a2b; --off:#6b7583; --un:#c9a089; --pay:#4fd3a2; --pay-soft:#12352a; --period:#111821; --err:#f28a80;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--pay);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top h1{font-size:19px;font-weight:800}
.top .sub{font-size:12px;color:var(--muted);line-height:1.2}
.top .gear{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid var(--hero-line);pointer-events:none}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted)}
.hero .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .date{font-family:var(--f-display);font-size:26px;font-weight:800}
.hero .count{font-size:13px;font-weight:800;color:#06261a;background:var(--pay);padding:2px 10px;border-radius:999px}
.hero .amt{font-family:var(--f-display);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .amt-cap{font-size:13px;color:var(--hero-muted);margin-top:6px}
.bar{height:8px;border-radius:8px;background:var(--hero-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pay);border-radius:8px}
.hero .barcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--hero-muted);margin-top:6px}
.curp{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--hero-line);background:rgba(255,255,255,.06);color:var(--hero-ink);border-radius:16px;padding:12px 14px}
.curp b{display:block;font-size:13.5px}
.curp span span{font-size:12px;color:var(--hero-muted)}
.curp>.num{font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.today{display:flex;align-items:center;gap:12px}
.today .dot{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:12px;flex:none;text-align:center}
.today .t1{font-weight:700}
.today .t2{font-size:13px;color:var(--muted)}
.stub-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.stub-head h2{font-size:16px;flex:1;min-width:0}
.nav-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:10px;font-size:16px;flex:none}
.stub-sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.stub{display:grid;border-top:1px dashed var(--line)}
.stub .ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.stub .ln .l{font-size:14px}
.stub .ln .d{grid-column:1;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.stub .ln .v{grid-row:1;grid-column:2;font-family:var(--f-mono);font-weight:600;font-size:14.5px;text-align:right}
.stub .ln.sub .v{color:var(--muted)}
.stub .ln.total{border-bottom:0}
.stub .ln.total .l{font-weight:800;font-family:var(--f-display);font-size:15.5px}
.stub .ln.total .v{font-size:19px;color:var(--pay)}
.stub .ln.gross .l,.stub .ln.gross .v{font-weight:700}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{font-size:17px;flex:1}
.cal-head .tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 10px;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:2px;font-weight:600}
.day{position:relative;border:1px solid transparent;border-radius:12px;min-height:62px;padding:5px 2px 4px;display:grid;justify-items:center;align-content:start;gap:3px;background:none;min-width:0}
.day.out{opacity:.35}
.day.inper{background:var(--period)}
.day.is-today{border-color:var(--ink)}
.day .d{font-size:13px;font-weight:600}
.day .s{font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;line-height:1.5;white-space:nowrap}
.day .pd{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;background:var(--pay);color:#06261a;font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1}
.day .hl{font-size:9px;color:var(--hol);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.day .chg{position:absolute;top:5px;left:5px;width:5px;height:5px;border-radius:50%;background:var(--ot)}
.s-W{background:var(--work-soft);color:var(--work)} .s-O{color:var(--off)} .s-OT{background:var(--ot-soft);color:var(--ot)}
.s-PTO{background:var(--pto-soft);color:var(--pto)} .s-H{background:var(--hol-soft);color:var(--hol)} .s-UN{color:var(--un);text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.legend .s{font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
.legend .pd{display:inline-grid;width:15px;height:15px;border-radius:50%;background:var(--pay);color:#06261a;font-size:10px;font-weight:800;place-items:center;margin-right:4px}
.outlook{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ok{background:var(--chip);border-radius:14px;padding:10px;display:grid;gap:2px;min-width:0}
.ok .v{font-family:var(--f-display);font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.ok .k{font-size:11.5px;color:var(--muted)}
.shade{position:fixed;inset:0;background:rgba(4,10,18,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:520px;margin:0 auto;display:grid;gap:14px}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h2{font-size:18px;flex:1}
.x{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:16px;flex:none}
.wiz{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wiz-in{max-width:520px;margin:0 auto;display:grid;gap:16px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.wiz h2{font-size:24px;line-height:1.25}
.lead{margin:0;color:var(--muted);font-size:14px}
.picks{display:grid;gap:8px}
.picks.two{grid-template-columns:1fr 1fr}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;display:grid;gap:2px}
.pick b{font-size:15.5px}
.pick span{font-size:12.5px;color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 10px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.quick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:flex;align-items:flex-start;gap:10px;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip .dw{text-align:center;font-size:11.5px;color:var(--muted)}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:58px;display:grid;place-items:center;padding:4px 0}
.strip button b{font-size:15px}
.strip button span{font-size:10px;color:var(--muted)}
.strip button[aria-pressed="true"]{background:var(--work);border-color:var(--work);color:var(--accent-ink)}
.strip button[aria-pressed="true"] span{color:inherit}
.strip button.td{outline:2px solid var(--ink);outline-offset:1px}
.wk{font-size:12.5px;color:var(--muted);margin:2px 0 -2px}
.result{border-radius:14px;padding:12px 14px;background:var(--accent-soft);font-size:14px;display:grid;gap:4px}
.calc{border-radius:14px;padding:12px 14px;background:var(--pay-soft);font-size:14px}
.calc b{font-family:var(--f-mono)}
.wiz-nav{display:flex;gap:8px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--chip);color:var(--ink)}
.err{color:var(--err);margin:0;min-height:1.2em;font-size:13.5px}
.lang{display:flex;gap:6px;justify-content:flex-end}
.lang button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.welcome{display:grid;gap:12px;padding-top:8px}
.welcome .big{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.feat{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.feat li{display:flex;gap:10px;align-items:center;font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.feat li i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;flex:none}
.done-list{display:grid;gap:8px;margin:0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;list-style:none}
.done-list li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.done-list li span{color:var(--muted);flex:none}
.done-list li b{text-align:right}
.setlist{display:grid;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.setlist button{border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;padding:13px 14px;display:flex;align-items:center;gap:10px}
.setlist button:last-child{border-bottom:0}
.setlist button b{flex:1;font-size:14.5px}
.setlist button span{font-size:12.5px;color:var(--muted);text-align:right;max-width:55%}
.setlist button::after{content:"›";color:var(--muted);font-size:18px}
.hours{display:flex;align-items:center;gap:10px}
.hours button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.hours output{flex:1;text-align:center;font-family:var(--f-mono);font-size:22px;font-weight:600}
.dedlist{display:grid;gap:8px}
.ded{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:8px}
.ded-top{display:flex;align-items:center;gap:8px}
.ded-top b{flex:1}
.ded-top .tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--chip);color:var(--muted)}
.ded-top .tag.pre{background:var(--pay-soft);color:var(--pay)}
.ded-top .rm{border:0;background:var(--chip);width:28px;height:28px;border-radius:50%;font-size:13px}
.ded-row{display:flex;gap:8px;align-items:center}
.ded-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px}
.ded-row span{font-size:12.5px;color:var(--muted);flex:none}
.addchips{display:flex;flex-wrap:wrap;gap:6px}
.addchips button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.stub .ln.sec{padding:10px 0 2px;border-bottom:0}
.stub .ln.sec .l{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tipbox{margin-top:10px;border-radius:14px;padding:10px 12px;background:var(--ot-soft);color:var(--ink);font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.tipbox b{color:var(--ot)}
.gain{border-radius:14px;padding:12px 14px;background:var(--ot-soft);font-size:14px}
.gain b{font-family:var(--f-display);font-size:20px;color:var(--ot);display:block}
.actual{margin-top:10px;display:grid;gap:6px}
.actual .row{display:flex;gap:8px;align-items:center}
.actual input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-family:var(--f-mono)}
.actual .diff{font-size:13px;font-weight:700}
.linkbtn{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13.5px;width:100%;margin-top:10px;color:var(--ink)}
.day .nt{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:14px;height:2px;border-radius:2px;background:var(--muted)}
textarea.note-in{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-height:70px;resize:vertical;font:inherit;color:inherit}
.outlook{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.yr{display:grid;gap:0;border-top:1px dashed var(--line)}
.yr div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.yr div b{font-family:var(--f-mono)}
.yr div.tot b{color:var(--pay);font-size:17px}
@media (max-width:380px){.hero .amt{font-size:38px}.outlook{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg></div>
    <div><h1>ShiftPay</h1><div class="sub" id="tagline"></div></div>
    <button class="gear" id="openSettings"></button>
  </header>
  <section class="hero" id="hero" aria-live="polite"></section>
  <section class="card today" id="today"></section>
  <section class="card" id="calCard"></section>
  <section class="card" id="stubCard"></section>
  <section class="card" id="outlookCard"></section>
</div>
<div class="shade" id="shade" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<section class="wiz" id="wiz" hidden></section>

<script>
/* ================= i18n ================= */
const L = {
  en:{

    estNet:"estimated take-home", estGross:"estimated gross pay", forPeriod:(a,b)=>`for ${a} – ${b}`,
    periodProgress:(d,tt)=>`Day ${d} of ${tt}`,
    todayShift:(lab,a,b)=>`${lab} · ${a} – ${b}`, todayOff:"Day off", todayOffSub:"Enjoy it. Picked up a shift? Tap the date on your calendar.",
    todayLbl:"Today", thisWeek:(h,o)=>`This week: ${h} worked/scheduled${o?` · ${o} overtime`:""}`,
    payPeriod:"Pay period", payday:"Payday",

/* ================= schedule engine ================= */
const paidHours = (st=S.shiftStart, en=S.shiftEnd, br=S.breakMin) => {
  const [a,b] = String(st||"0:0").split(":").map(Number), [c,d] = String(en||"0:0").split(":").map(Number);

const cycleStr = (st=S) => st.pattern==="custom" ? ((st.customCycle||"").toUpperCase().replace(/[^WO]/g,"") || "WO") : PATS[st.pattern];
function baseAt(n, st=S){
  const c = cycleStr(st);

  if(c==="SIX") return dowN(n)===+st.sixOff ? "O" : "W";
  const i = ((n - dayNum(st.cycleStart)) % c.length + c.length) % c.length;
  return c[i]==="W" ? "W" : "O";
}
const statusAt = n => S.overrides[fromNum(n)] || baseAt(n);
const isWork = s => s==="W"||s==="OT"||s==="H";

const wkCache = new Map();
function weekBuckets(ws){
  if(wkCache.has(ws)) return wkCache.get(ws);
  const out = {}; let pool = 0;
  for(let i=0;i<7;i++){
    const n = ws+i, st = statusAt(n), h = hoursAt(n);
    const b = { st, reg:0, ot:0, dbl:0, hol:0, pto:0, extra:0, worked:0, night:0, juhyu:0 };
    if(st==="PTO") b.pto = h;
    else if(KR() && isWork(st)){
      b.worked = h;
      if(S.payType==="salary"){ if(st==="OT") b.extra = h; else if(S.salaryDayOT) b.extra = Math.max(0, h - paidHours()); }
      else if(st==="H" || holidayOf(n)){ b.hol = Math.min(h,8); b.dbl = Math.max(h-8,0); }
      else { const dr = Math.min(h,8), reg = Math.max(0, Math.min(dr, 40 - pool)); pool += reg; b.reg = reg; b.ot = (h - dr) + (dr - reg); }
      if(S.krNight && !S.krSmall && S.payType==="hourly") b.night = Math.min(h, nightHours(S.shiftStart, S.shiftEnd, S.breakMin) * (h / (paidHours()||h)));
    }
    else if(isWork(st)){
      b.worked = h;
      if(S.payType==="salary"){ if(st==="OT") b.extra = h; else if(S.salaryDayOT) b.extra = Math.max(0, h - paidHours()); }
      else if(st==="H" || (S.holidayPremium && holidayOf(n))) b.hol = h;
      else if(S.seventhDouble && streakAt(n)===7) b.dbl = h;
      else {
        let dr = h, dot = 0, dd = 0;
        if(S.dailyOT){ dr = Math.min(h,8); dot = Math.min(Math.max(h-8,0),4); dd = Math.max(h-12,0); }
        const reg = Math.max(0, Math.min(dr, 40 - pool)); pool += reg;

/* pay periods */
const adjWeekend = (n, st=S) => !st.weekendAdj ? n : dowN(n)===6 ? n-1 : dowN(n)===0 ? n-2 : n;

    const s = a + Math.floor((n - a)/len)*len, e = s + len - 1;

function paycheck(p){

function renderCal(){
  const first = Date.UTC(viewY, viewM-1, 1)/864e5, last = lastDayN(viewY, viewM);
  const lead = (dowN(first) - S.weekStart + 7) % 7, cells = Math.ceil((lead + (last-first+1))/7)*7;
  const sel = shiftPeriod(nextPayPeriod(), periodOffset);
  const pays = new Set(); let p = periodFor(first - 75), g = 0; while(p.s <= last + 40 && g++ < 60){ pays.add(p.pay); p = periodFor(p.e+1); }
  let h = "";
  for(let i=0;i<7;i++) h += `<div class="dow">${fDow((S.weekStart+i)%7)}</div>`;
  for(let i=0;i<cells;i++){
    const n = first - lead + i, st = statusAt(n), dd = ymdN(n)[2], hol = holidayOf(n), k = fromNum(n);
    const cls = ["day"]; if(n<first||n>last) cls.push("out"); if(n>=sel.s && n<=sel.e) cls.push("inper"); if(n===TODAY) cls.push("is-today");
    const changed = S.overrides[k] || S.hours[k] != null;
    h += `<button class="${cls.join(" ")}" data-n="${n}" aria-label="${fDateW(n)} ${t("stLong")[st]}${pays.has(n)?" · "+t("payday"):""}${hol?" · "+hol[S.lang]:""}">${changed?'<span class="chg"></span>':""}${pays.has(n)?'<span class="pd">$</span>':""}<span class="d num">${dd}</span><span class="s s-${st}">${t("st")[st]}</span>${hol?`<span class="hl">${hol[S.lang]}</span>`:""}${S.notes[k]?'<span class="nt"></span>':""}</button>`;
  }
  $("#calCard").innerHTML = `
    <div class="cal-head"><button class="nav-btn" id="mPrev" aria-label="Previous month">‹</button><h2>${fmt(first,{year:"numeric",month:"long"})}</h2><button class="tbtn" id="mToday">${t("today")}</button><button class="nav-btn" id="mNext" aria-label="Next month">›</button></div>
    <div class="grid" id="cal">${h}</div>
    <div class="legend"><span><span class="pd">$</span>${t("legendPay")}</span><span class="s s-OT">OT</span><span class="s s-PTO">PTO</span><span class="s s-H">${t("st").H}</span><span>${t("tapHint")}</span></div>`;
  $("#mPrev").onclick = () => { viewM--; if(viewM<1){viewM=12;viewY--;} renderCal(); };
  $("#mNext").onclick = () => { viewM++; if(viewM>12){viewM=1;viewY++;} renderCal(); };
  $("#mToday").onclick = () => { viewY = NOW.getFullYear(); viewM = NOW.getMonth()+1; periodOffset = 0; renderStub(); renderCal(); };
  $("#cal").onclick = e => { const b = e.target.closest("[data-n]"); if(b) openDay(+b.dataset.n); };
}
function renderOutlook(){
  const y = ymdN(TODAY)[0], dec31 = Date.UTC(y,11,31)/864e5;
  let rest = 0, next = 0, cnt = 0, p = nextPayPeriod(), g = 0;
  while(p.pay <= TODAY + 365 && g++ < 60){
    const pc = paycheck(p), v = taxesOn() ? pc.net : pc.gross;

    p = periodFor(p.e+1);
  }
  $("#outlookCard").innerHTML = `<div class="cal-head" style="margin-bottom:10px"><h2 style="font-size:16px">${t("outlook")}</h2></div>

      <div class="ok"><span class="v num">${money0(next)}</span><span class="k">${t("next12")}</span></div>

function openDay(n){
  const k = fromNum(n), base = baseAt(n), hol = holidayOf(n);

  const draw = () => {
    const cur = statusAt(n), h = hoursAt(n);
    openSheet(`<div class="sheet-head"><h2>${fDateW(n)}${hol?` · ${hol[S.lang]}`:""}</h2><button class="x" id="dX" aria-label="Close">✕</button></div>
      <p class="lead">${t("original", t("stLong")[base])}${(S.overrides[k]||S.hours[k]!=null)?` · ${t("changed")}`:""}</p>
      <div class="picks two">${opts.map(o => `<button class="pick" data-s="${o}" aria-pressed="${o===cur}"><b>${t("stLong")[o]}</b><span>${t("stDesc")[o]}</span></button>`).join("")}</div>
      ${(() => {
        if(cur==="O" && !(S.payType==="salary" && !(+S.salaryOtMult>0))){ const v = shiftValue(n, "OT"); if(v.gross>0) return `<div class="gain">${t("pickupTitle")}<b>${taxesOn() ? t("pickupNet", money(v.net)) : t("pickupGross", money(v.gross))}</b>${taxesOn()?`<span class="hint">${t("pickupGross", money(v.gross))}</span>`:""}</div>`; }
        if(isWork(cur) && S.payType==="hourly"){ const a = shiftValue(n, "O"); return `<p class="hint">${t("dayValue", money(-(taxesOn()?a.net:a.gross)))}</p>`; }
        return "";
      })()}
      ${(isWork(cur)||cur==="PTO") ? `<div class="field"><span class="lbl">${t("hoursLbl")}</span><div class="hours"><button id="hM" aria-label="minus half hour">−</button><output class="num">${h}</output><button id="hP" aria-label="plus half hour">+</button></div></div>` : ""}
      <div class="field"><label for="dNote">${t("noteLbl")}</label><textarea class="note-in" id="dNote" placeholder="${t("notePh")}">${(S.notes[k]||"").replace(/</g,"&lt;")}</textarea></div>
      <div class="wiz-nav"><button class="btn ghost" id="dReset">${t("reset")}</button><button class="btn" id="dDone">${t("done")}</button></div>`);
    const dn = $("#dNote"); dn.oninput = () => { if(dn.value.trim()) S.notes[k] = dn.value; else delete S.notes[k]; save(); };
    dn.onblur = () => renderCal();
    $("#dX").onclick = closeSheet; $("#dDone").onclick = closeSheet;
    $("#sheet").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const s = b.dataset.s; if(s===base) delete S.overrides[k]; else S.overrides[k] = s; save(); render(); draw(); });
    const step = d => { const v = Math.max(0, Math.min(24, Math.round((hoursAt(n)+d)*2)/2)); if(v===paidHours()) delete S.hours[k]; else S.hours[k] = v; save(); render(); draw(); };
    const hm = $("#hM"), hp = $("#hP"); if(hm){ hm.onclick = () => step(-0.5); hp.onclick = () => step(0.5); }
    $("#dReset").onclick = () => { delete S.overrides[k]; delete S.hours[k]; save(); render(); draw(); };
  };
  draw();
}

/* ================= setup wizard ================= */
const STEPS = ["welcome","pattern","shift","days","pay","ot","freq","payday","tax","ded","done"];
const CHAINS = { pattern:["pattern","days"], shift:["shift"], pay:["pay","ot"], ot:["ot"], freq:["freq","payday"], tax:["tax"], ded:["ded"] };
function openWizard(only){
  W = JSON.parse(JSON.stringify(S));
  W._chain = only ? CHAINS[only] : null; W._step = only ? STEPS.indexOf(W._chain[0]) : 0;
  W._tapped = []; W._err = ""; W._stripStart = TODAY - dowN(TODAY);
  renderWiz(); $("#wiz").hidden = false; $("#wiz").scrollTop = 0; document.body.style.overflow = "hidden";
}
function closeWiz(){ $("#wiz").hidden = true; document.body.style.overflow = ""; W = null; }
function wDetect(){
  const c = cycleStr(W); if(c==="MF"||c==="SIX") return null;
  const tap = new Set(W._tapped), len = c.length; let best = 0, bs = -1;
  for(let o=0;o<len;o++){ let sc = 0; for(let i=0;i<14;i++){ if((c[(i+o)%len]==="W") === tap.has(W._stripStart+i)) sc++; } if(sc > bs){ bs = sc; best = o; } }
  return { start: fromNum(W._stripStart - best), score: bs };
}
function stripHtml(mode){
  let h = "";
  for(let wk=0; wk<2; wk++){
    h += `<div class="wk">${wk ? t("nextWk") : t("thisWk")}</div><div class="strip">`;
    for(let i=0;i<7;i++) h += `<div class="dw">${fDow(dowN(W._stripStart + wk*7 + i))}</div>`;
    for(let i=0;i<7;i++){
      const n = W._stripStart + wk*7 + i, on = mode==="tap" ? W._tapped.includes(n) : baseAt(n, W)==="W";
      h += `<button ${mode==="tap"?`data-n="${n}"`:"disabled"} class="${n===TODAY?"td":""}" aria-pressed="${on}"><b>${ymdN(n)[2]}</b><span>${on?t("work"):t("off")}</span></button>`;
    }
    h += `</div>`;
  }
  return h;
}
const pickH = (attr, cur, items) => items.map(([v,a,b]) => `<button class="pick" data-${attr}="${v}" aria-pressed="${String(v)===String(cur)}"><b>${a}</b>${b?`<span>${b}</span>`:""}</button>`).join("");
const quickH = (attr, cur, items) => items.map(([v,l]) => `<button data-${attr}="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("");
const togH = (id, on, [a,b]) => `<label class="toggle"><input type="checkbox" id="${id}" ${on?"checked":""}><span><b>${a}</b><small>${b}</small></span></label>`;

function renderWiz(){
  const step = STEPS[W._step], el = $("#wiz"), editing = !!W._chain;
  let body = "", nextL = t("next"), skip = false;
  if(step==="welcome"){
    body = `<div class="lang">${quickH("lang", W.lang, [["en","English"],["ko","한국어"]])}</div>
      <div class="field"><span class="lbl">${t("countryLbl")}</span><div class="picks two">${pickH("cty", W.country, [["US", t("cUS"), "USD $"],["KR", t("cKR"), "KRW ₩"]])}</div></div>
      <div class="welcome"><div class="big">${t("welcomeBig")}</div><p class="lead">${t("welcomeLead")}</p>
      <ul class="feat"><li><i class="s-W">1</i>${t("feat1")}</li><li><i class="s-OT">2</i>${t("feat2")}</li><li><i style="background:var(--pay-soft);color:var(--pay)">$</i>${t("feat3")}</li></ul></div>`;
    nextL = t("getStarted");
  } else if(step==="pattern"){
    body = `<h2>${t("q_pattern")}</h2><p class="lead">${t("q_patternLead")}</p>
      <div class="picks">${pickH("pat", W.pattern, Object.keys(PATS).map(k => [k, ...t("pat")[k]]))}</div>
      ${W.pattern==="custom" ? `<div class="field"><label for="wCustom">${t("customLbl")}</label><input id="wCustom" value="${W.customCycle}" autocapitalize="characters"><span class="hint">${t("customHint")}</span></div>` : ""}`;
  } else if(step==="shift"){
    body = `<h2>${t("q_shift")}</h2>
      <div class="quick">${quickH("lab", W.shiftLabel, [["day",t("dayShift")],["night",t("nightShift")]])}</div>
      <div class="row3">
        <div class="field"><label for="wS">${t("startLbl")}</label><input id="wS" type="time" value="${W.shiftStart}"></div>
        <div class="field"><label for="wE">${t("endLbl")}</label><input id="wE" type="time" value="${W.shiftEnd}"></div>
        <div class="field"><label for="wB">${t("breakLbl")}</label><select id="wB">${[0,15,30,45,60].map(m=>`<option value="${m}" ${+W.breakMin===m?"selected":""}>${m} ${t("min")}</option>`).join("")}</select></div>
      </div>
      <div class="calc" id="wCalc">${t("paidHours", paidHours(W.shiftStart, W.shiftEnd, W.breakMin))}</div>`;
  } else if(step==="days"){
    if(W.pattern==="p5") body = `<h2>${t("q_days")}</h2><div class="result">${t("fixedMF")}</div>${stripHtml("preview")}`;
    else if(W.pattern==="p6") body = `<h2>${t("fixed6")}</h2><div class="quick">${quickH("six", W.sixOff, [0,1,2,3,4,5,6].map(d=>[d, fDowLong(d)]))}</div>${stripHtml("preview")}`;
    else {
      const det = W._tapped.length ? wDetect() : null;
      body = `<h2>${t("q_days")}</h2><p class="lead">${t("q_daysLead", t("pat")[W.pattern][0])}</p>${stripHtml("tap")}
        ${det ? `<div class="result"><b>${det.score===14 ? t("matchPerfect") : t("matchClose", det.score)}</b></div>` : ""}`;
    }
  } else if(step==="pay"){
    body = `<h2>${t("q_pay")}</h2>
      <div class="picks two">${pickH("pt", W.payType, [["hourly",...t("hourly")],["salary",...t("salary")]])}</div>
      ${W.country==="KR" ? (W.payType==="hourly"
        ? `<div class="field"><label for="wRate">${t("krRate")}</label><input id="wRate" type="number" inputmode="numeric" step="10" min="0" value="${W.rate}" placeholder="10320"><span class="hint">${t("krRateHint")}</span></div>`
        : `<div class="field"><label for="wSal">${t("krMonthly")}</label><input id="wSal" type="number" inputmode="numeric" step="10000" min="0" value="${W.salary}" placeholder="3000000"></div>`) :
      W.payType==="hourly" ? `
        <div class="field"><label for="wRate">${t("rateLbl")} ($)</label><input id="wRate" type="number" inputmode="decimal" step="0.01" min="0" value="${W.rate}" placeholder="25.00"></div>
        <div class="field"><label for="wDiff">${t("diffLbl")} ($${t("perHr")})</label><input id="wDiff" type="number" inputmode="decimal" step="0.25" min="0" value="${W.diff}"><span class="hint">${t("diffHint")}</span></div>`
      : `<div class="field"><label for="wSal">${t("salaryLbl")} ($)</label><input id="wSal" type="number" inputmode="numeric" step="500" min="0" value="${W.salary}" placeholder="65000"></div>`}`;
  } else if(step==="ot" && W.country==="KR"){
    body = `<h2>${t("krOtTitle")}</h2><p class="lead">${t("krOtLead")}</p>
      ${W.payType==="hourly" ? `${togH("wKs", W.krSmall, t("krSmall"))}${togH("wKn", W.krNight, t("krNight"))}${togH("wKj", W.krJuhyu, t("krJuhyu"))}`
        : `<div class="field"><span class="lbl">${t("krSalOt")}</span><div class="quick">${quickH("som", W.salaryOtMult, [[1,"1×"],[1.5,"1.5×"],[2,"2×"]])}</div><span class="hint">${t("krSalOtHint")}</span></div>${togH("wSdo", W.salaryDayOT, t("salDayOT"))}`}`;
  } else if(step==="ot"){
    if(W.payType==="hourly"){
      body = `<h2>${t("q_ot")}</h2><p class="lead">${t("q_otLead")}</p>
        <div class="field"><span class="lbl">${t("otMultLbl")}</span><div class="quick">${quickH("otm", W.otMult, [[1.5,"1.5×"],[2,"2×"]])}</div></div>
        ${togH("wDaily", W.dailyOT, t("dailyOT"))}${togH("w7", W.seventhDouble, t("seventh"))}${togH("wHol", W.holidayPremium, t("holPrem"))}
        ${W.holidayPremium ? `<div class="field"><span class="lbl">${t("holMultLbl")}</span><div class="quick">${quickH("hm", W.holidayMult, [[1.5,"1.5×"],[2,"2×"],[2.5,"2.5×"],[3,"3×"]])}</div></div>` : ""}`;
    } else {
      body = `<h2>${t("q_ot")}</h2><p class="lead">${t("salOtLead")}</p>
        <div class="field"><span class="lbl">${t("salOtMult")}</span><div class="quick">${quickH("som", W.salaryOtMult, [[0,"0×"],[1,"1×"],[1.5,"1.5×"],[2,"2×"]])}</div><span class="hint">${t("salOtHint")}</span></div>${togH("wSdo", W.salaryDayOT, t("salDayOT"))}`;
    }
  } else if(step==="freq"){
    body = `<h2>${t("q_freq")}</h2><div class="picks">${pickH("fq", W.freq, ["weekly","biweekly","semimonthly","monthly"].map(k => [k, ...t("freq")[k]]))}</div>`;
  } else if(step==="payday"){
    const np = nextPayPeriod(W), wsQ = `<div class="field"><span class="lbl">${t("weekStartLbl")}</span><div class="quick">${quickH("ws", W.weekStart, [[0,fDowLong(0)],[1,fDowLong(1)]])}</div></div>`;
    if(W.freq==="weekly" || W.freq==="biweekly"){
      body = `<h2>${t("q_payday")}</h2>${wsQ}
        <div class="field"><label for="wAnchor">${t("periodStartLbl")}</label><input id="wAnchor" type="date" value="${W.periodAnchor}"><span class="hint">${t("periodStartHint")}</span></div>
        <div class="field"><span class="lbl">${t("paydayDowLbl")}</span><div class="quick">${quickH("pd", W.payDow, [1,2,3,4,5].map(d=>[d, fDowLong(d)]))}</div></div>
        <div class="field"><span class="lbl">${t("delayLbl")}</span><div class="quick">${quickH("dl", W.payDelay, [[0,t("delay0")],[1,t("delay1")],[2,t("delay2")]])}</div></div>`;
    } else if(W.freq==="semimonthly"){
      body = `<h2>${t("q_payday")}</h2><p class="lead">${t("semiLbl")}</p>
        <div class="picks">${pickH("sm", W.semiMode, [["end",t("semiEnd")],["lag",t("semiLag")]])}</div>
        ${W.semiMode==="lag" ? `<div class="field"><label for="wLag">${t("lagDays")}</label><input id="wLag" type="number" min="0" max="20" value="${W.semiLag}"></div>` : ""}
        ${togH("wWk", W.weekendAdj, t("weekendAdj"))}${wsQ}`;
    } else {
      body = `<h2>${t("q_payday")}</h2>
        <div class="picks">${pickH("mm", W.monthlyMode, [["same",t("monthlySame")],["last",t("monthlyLast")],["day",t("monthlyDay")]])}</div>
        ${W.monthlyMode==="day" || W.monthlyMode==="same" ? `<div class="field"><label for="wMd">${W.monthlyMode==="same" ? t("monthlySame") : t("dayOfMonth")}</label><input id="wMd" type="number" min="1" max="31" value="${W.monthlyDay}"></div>` : ""}
        ${togH("wWk", W.weekendAdj, t("weekendAdj"))}${wsQ}`;
    }
    body += `<div class="calc" id="wPayPrev">${t("paydayPreview", fDate(np.s), fDate(np.e), fDateW(np.pay))}</div>`;
  } else if(step==="tax" && W.country==="KR"){
    if(W.taxMode==="auto") W.taxMode = "kr";
    body = `<h2>${t("q_tax")}</h2><div class="picks two">${pickH("tm", W.taxMode, [["kr",...t("krTaxAuto")],["manual",...t("taxManual")]])}</div>`;
    body += W.taxMode==="kr" ? `<div class="row2">
        <div class="field"><label for="wKd">${t("krDeps")}</label><input id="wKd" type="number" min="1" max="12" value="${W.krDeps||1}"></div>
        <div class="field"><label for="wKk">${t("krKids")}</label><input id="wKk" type="number" min="0" max="12" value="${W.krKids||0}"></div></div>
      <div class="field"><span class="lbl">${t("krWh")}</span><div class="quick">${quickH("kw", W.krWh, [[80,"80%"],[100,"100%"],[120,"120%"]])}</div></div>
      <div class="field"><label for="wKnt">${t("krNonTax")}</label><input id="wKnt" type="number" inputmode="numeric" step="10000" min="0" value="${W.krNonTax}"><span class="hint">${t("krNonTaxHint")}</span></div>`
      : `<div class="field"><label for="wTax">${t("taxLbl")}</label><input id="wTax" type="number" inputmode="decimal" step="0.5" min="0" max="60" value="${W.taxPct||""}" placeholder="10"></div>`;
    body += `<div class="calc" id="wTaxPrev"></div>`;
  } else if(step==="tax"){
    if(W.taxMode==="kr") W.taxMode = "auto";
    body = `<h2>${t("q_tax")}</h2>
      <div class="picks two">${pickH("tm", W.taxMode, [["auto",...t("taxAuto")],["manual",...t("taxManual")]])}</div>`;
    if(W.taxMode==="auto"){
      const st = ST[W.state];
      body += `<div class="field"><label for="wState">${t("stateLbl")}</label><select id="wState">${Object.entries(ST).sort((a,b)=>a[1][0].localeCompare(b[1][0])).map(([k,v])=>`<option value="${k}" ${k===W.state?"selected":""}>${v[0]}</option>`).join("")}</select>
          ${st && !st[4].length ? `<span class="hint">${t("noStateTax", st[0])}</span>` : ""}</div>
        <div class="field"><span class="lbl">${t("filingLbl")}</span><div class="quick">${quickH("fs", W.filing, Object.entries(t("filing")))}</div></div>
        <div class="row2">
          <div class="field"><label for="wKids">${t("kidsLbl")}</label><input id="wKids" type="number" min="0" max="12" value="${W.kids||0}"></div>
          <div class="field"><label for="wDeps">${t("depsLbl")}</label><input id="wDeps" type="number" min="0" max="12" value="${W.otherDeps||0}"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="wXwh">${t("extraWHLbl")}</label><input id="wXwh" type="number" inputmode="decimal" min="0" step="5" value="${W.extraWH||""}" placeholder="0"></div>
          <div class="field"><label for="wLocal">${t("localLbl")}</label><input id="wLocal" type="number" inputmode="decimal" min="0" max="5" step="0.1" value="${W.localPct||""}" placeholder="0"></div>
        </div><span class="hint">${t("localHint")}</span>`;
    } else {
      body += `<div class="field"><label for="wTax">${t("taxLbl")}</label><input id="wTax" type="number" inputmode="decimal" step="0.5" min="0" max="60" value="${W.taxPct||""}" placeholder="18">
        <div class="quick">${quickH("tx", W.taxPct, [[15,"15%"],[18,"18%"],[20,"20%"],[25,"25%"]])}</div><span class="hint">${t("taxHint")}</span></div>`;
    }
    body += `<div class="calc" id="wTaxPrev"></div>`;
  } else if(step==="ded"){
    skip = !editing;
    const have = new Set((W.deds||[]).filter(d=>d.type!=="other").map(d=>d.type));
    body = `<h2>${t("q_ded")}</h2><p class="lead">${t("q_dedLead")}</p>
      <div class="dedlist">${(W.deds||[]).length ? W.deds.map((d,i) => {
        const def = DEDS[d.type]||DEDS.other, pre = d.type==="other" ? !!d.pre : def.tax!=="post";
        return `<div class="ded"><div class="ded-top"><b>${d.type==="other" ? t("dedNames").other : t("dedNames")[d.type]}</b><span class="tag ${pre?"pre":""}">${pre?t("preTax"):t("postTax")}</span><button class="rm" data-rm="${i}" aria-label="Remove">✕</button></div>
          ${d.type==="other" ? `<div class="ded-row"><input data-name="${i}" value="${(d.name||"").replace(/"/g,"&quot;")}" placeholder="${t("otherName")}"></div>
            <div class="quick">${quickH("op"+i, d.pre?1:0, [[1,t("preTax")],[0,t("postTax")]])}</div>` : ""}
          <div class="ded-row"><input data-amt="${i}" type="number" inputmode="decimal" min="0" step="${def.unit==="%"?0.5:1}" value="${d.amt||""}" placeholder="0"><span>${def.unit==="%"?t("pctGross"):t("perCheck")}</span></div></div>`;
      }).join("") : `<p class="hint">${t("noDeds")}</p>`}</div>
      <div class="field"><span class="lbl">${t("addDed")}</span><div class="addchips">${Object.keys(DEDS).filter(k => (W.country!=="KR" || ["union","life","other"].includes(k)) && (k==="other" || !have.has(k))).map(k => `<button data-add="${k}">+ ${t("dedNames")[k]}</button>`).join("")}</div></div>
      <div class="calc" id="wTaxPrev"></div>`;
  } else {
    const np = nextPayPeriod(W);
    body = `<h2>${t("q_done")}</h2>
      <ul class="done-list">
        <li><span>${t("sumRot")}</span><b>${t("pat")[W.pattern][0]}</b></li>
        <li><span>${t("sumShift")}</span><b>${W.shiftLabel==="night"?t("nightShift"):t("dayShift")} · ${fTime(W.shiftStart)} – ${fTime(W.shiftEnd)}</b></li>
        <li><span>${t("sumPay")}</span><b>${W.payType==="hourly" ? money(+W.rate||0)+t("perHr") : money0(+W.salary||0)+t("perYr")}</b></li>
        <li><span>${t("sumFreq")}</span><b>${t("freq")[W.freq][0]}</b></li>
        <li><span>${t("sumNext")}</span><b>${fDateW(np.pay)}</b></li>
      </ul>${stripHtml("preview")}<p class="lead">${t("doneNote")}</p>`;
    nextL = t("start");
  }
  if(editing && W._chain.indexOf(step) === W._chain.length-1) nextL = t("save");
  const bar = editing ? "" : `<div class="steps">${STEPS.map((_,i)=>`<i class="${i<=W._step?"on":""}"></i>`).join("")}</div>`;
  const leftBtn = editing ? `<button class="btn ghost" id="wCancel">${t("cancel")}</button>` : (W._step>0 ? `<button class="btn ghost" id="wBack">${t("back")}</button>` : "");
  el.innerHTML = `<div class="wiz-in">${bar}${body}<p class="err">${W._err||""}</p>
    <div class="wiz-nav">${leftBtn}${skip?`<button class="btn ghost" id="wSkip">${t("skip")}</button>`:""}<button class="btn" id="wNext">${nextL}</button></div></div>`;
  W._err = "";
  wireWiz();
}
function wireWiz(){
  const el = $("#wiz");
  const setv = (attr, key, num) => el.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => { W[key] = num ? Number(b.dataset[attr]) : b.dataset[attr]; renderWiz(); });
  el.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { W.lang = b.dataset.lang; S.lang = W.lang; render(); renderWiz(); });
  setv("pat","pattern"); setv("lab","shiftLabel"); setv("six","sixOff",true); setv("pt","payType"); setv("otm","otMult",true); setv("hm","holidayMult",true);
  setv("som","salaryOtMult",true); setv("fq","freq"); setv("ws","weekStart",true); setv("pd","payDow",true); setv("dl","payDelay",true);
  setv("sm","semiMode"); setv("mm","monthlyMode"); setv("tx","taxPct",true);
  el.querySelectorAll(".strip [data-n]").forEach(b => b.onclick = () => { const n = +b.dataset.n, i = W._tapped.indexOf(n); i>=0 ? W._tapped.splice(i,1) : W._tapped.push(n); renderWiz(); });
  const payPrev = () => { const c = $("#wPayPrev"); if(!c) return; try{ const np = nextPayPeriod(W); c.innerHTML = t("paydayPreview", fDate(np.s), fDate(np.e), fDateW(np.pay)); }catch(e){} };
  const calc = () => { const c = $("#wCalc"); if(c) c.innerHTML = t("paidHours", paidHours(W.shiftStart, W.shiftEnd, W.breakMin)); };
  const inp = (id, key, num, live) => { const x = $("#"+id); if(!x) return; x.oninput = x.onchange = () => { W[key] = num ? (x.value===""?"":Number(x.value)) : x.value; if(live) live(); }; };
  inp("wCustom","customCycle"); inp("wS","shiftStart",false,calc); inp("wE","shiftEnd",false,calc); inp("wB","breakMin",true,calc);
  inp("wRate","rate",true); inp("wDiff","diff",true); inp("wSal","salary",true);
  inp("wAnchor","periodAnchor",false,() => { if(/^\d{4}-\d{2}-\d{2}$/.test(W.periodAnchor)) payPrev(); });
  inp("wLag","semiLag",true,payPrev); inp("wMd","monthlyDay",true,payPrev);
  inp("w401","k401",true); inp("wIns","insurance",true); inp("wTax","taxPct",true);
  const cb = (id, key) => { const x = $("#"+id); if(x) x.onchange = () => { W[key] = x.checked; renderWiz(); }; };
  cb("wDaily","dailyOT"); cb("w7","seventhDouble"); cb("wHol","holidayPremium"); cb("wWk","weekendAdj");
  setv("tm","taxMode"); setv("fs","filing"); setv("kw","krWh",true);
  el.querySelectorAll("[data-cty]").forEach(b => b.onclick = () => { const c = b.dataset.cty; if(c===W.country) return; W.country = c;
    if(c==="KR"){ Object.assign(W, { freq:"monthly", monthlyMode:"same", monthlyDay:25, weekStart:1, taxMode:"kr", salaryOtMult:1.5, rate:"", salary:"", deds:[] }); }
    else { Object.assign(W, { freq:"biweekly", weekStart:0, payDow:5, payDelay:0, taxMode:"auto", salaryOtMult:1, rate:"", salary:"", deds:[] }); }
    S.country = c; render(); renderWiz(); });
  const cbk = (id, key) => { const x = $("#"+id); if(x) x.onchange = () => { W[key] = x.checked; renderWiz(); }; };
  cbk("wSdo","salaryDayOT"); cbk("wKs","krSmall"); cbk("wKn","krNight"); cbk("wKj","krJuhyu");
  const taxPrev = () => { const c = $("#wTaxPrev"); if(!c) return; const g = typicalGross(W); if(!(g>0)){ c.hidden = true; return; } c.hidden = false;
    const keep = S.country; S.country = W.country; const r = taxCalc(g, W); S.country = keep; c.innerHTML = taxesOn(W) ? t("taxPreview", money(r.taxTotal), money(r.net)) : `${t("gross")} ${money(g)} → ${money(r.net)}`; };
  const stSel = $("#wState"); if(stSel) stSel.onchange = () => { W.state = stSel.value; renderWiz(); };
  inp("wKd","krDeps",true,taxPrev); inp("wKk","krKids",true,taxPrev); inp("wKnt","krNonTax",true,taxPrev);
  inp("wKids","kids",true,taxPrev); inp("wDeps","otherDeps",true,taxPrev); inp("wXwh","extraWH",true,taxPrev); inp("wLocal","localPct",true,taxPrev);
  const wt = $("#wTax"); if(wt) wt.addEventListener("input", taxPrev);
  el.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { W.deds = W.deds||[]; W.deds.push({ type:b.dataset.add, amt:"", name:"", pre:false }); renderWiz(); const ins = el.querySelectorAll("[data-amt]"); if(ins.length) ins[ins.length-1].focus(); });
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { W.deds.splice(+b.dataset.rm,1); renderWiz(); });
  el.querySelectorAll("[data-amt]").forEach(x => x.oninput = () => { W.deds[+x.dataset.amt].amt = x.value===""?"":Number(x.value); taxPrev(); });
  el.querySelectorAll("[data-name]").forEach(x => x.oninput = () => { W.deds[+x.dataset.name].name = x.value; });
  (W.deds||[]).forEach((d,i) => el.querySelectorAll(`[data-op${i}]`).forEach(b => b.onclick = () => { d.pre = b.dataset["op"+i]==="1"; renderWiz(); }));
  taxPrev();
  const back = $("#wBack"); if(back) back.onclick = () => { W._step--; renderWiz(); el.scrollTop = 0; };
  const cancel = $("#wCancel"); if(cancel) cancel.onclick = closeWiz;
  const sk = $("#wSkip"); if(sk) sk.onclick = () => { W.deds = []; W._step++; renderWiz(); el.scrollTop = 0; };
  $("#wNext").onclick = wizNext;
}
function wizNext(){
  const step = STEPS[W._step], fail = m => { W._err = t(m); renderWiz(); };
  if(step==="pattern" && W.pattern==="custom" && !/W/.test((W.customCycle||"").toUpperCase())) return fail("err_custom");
  if(step==="shift" && !(paidHours(W.shiftStart, W.shiftEnd, W.breakMin) > 0)) return fail("err_time");
  if(step==="days" && !["p5","p6"].includes(W.pattern)){
    if(!W._tapped.length) return fail("err_tap");
    W.cycleStart = wDetect().start;
  }
  if(step==="pay"){ if(W.payType==="hourly" && !(+W.rate > 0)) return fail("err_rate"); if(W.payType==="salary" && !(+W.salary > 0)) return fail("err_salary"); }
  if(step==="payday" && (W.freq==="weekly"||W.freq==="biweekly") && !/^\d{4}-\d{2}-\d{2}$/.test(W.periodAnchor||"")) return fail("err_date");
  if(W._chain){
    const i = W._chain.indexOf(step);
    if(i < W._chain.length-1){ W._step = STEPS.indexOf(W._chain[i+1]); renderWiz(); $("#wiz").scrollTop = 0; return; }
    return commitWiz();
  }
  if(step==="done") return commitWiz();
  W._step++; renderWiz(); $("#wiz").scrollTop = 0;
}
function commitWiz(){
  const next = {};
  for(const k in W){ if(k[0] !== "_") next[k] = W[k]; }
  next.overrides = S.overrides; next.hours = S.hours; next.notes = S.notes; next.bonuses = S.bonuses; next.actuals = S.actuals; next.pto = S.pto;
  if(!next.startDate) next.startDate = fromNum(periodFor(TODAY, next).s);
  ["rate","diff","salary","taxPct","semiLag","monthlyDay","breakMin","kids","otherDeps","extraWH","localPct","krDeps","krKids","krNonTax","krWh"].forEach(k => next[k] = next[k]===""?0:+next[k]);
  next.deds = (next.deds||[]).filter(d => +d.amt > 0).map(d => ({ ...d, amt:+d.amt }));
  next.setupDone = true;
  S = next; save(); periodOffset = 0; render(); closeWiz();
}

function migrate(o){
  if(!Array.isArray(o.deds)) o.deds = [];
  ["notes","bonuses","actuals","overrides","hours"].forEach(k => { if(!o[k] || typeof o[k] !== "object") o[k] = {}; });
  if(o.k401 > 0 && !o.deds.some(d=>d.type==="k401")) o.deds.push({ type:"k401", amt:+o.k401 });
  if(o.insurance > 0 && !o.deds.some(d=>d.type==="health")) o.deds.push({ type:"health", amt:+o.insurance });
  delete o.k401; delete o.insurance;
  if(o.salaryDayOT === undefined) o.salaryDayOT = true;
  if(!o.taxMode) o.taxMode = +o.taxPct > 0 ? "manual" : "auto";
  return o;
}
/* ================= boot ================= */
(function(){
  const local = loadLocal(); if(local) S = migrate(Object.assign(defaults(), local));
  render();
  if(!S.setupDone) openWizard();
  (async () => {
    if(!window.claude) return;
    const [db, user] = await Promise.all([claude.use("db").catch(()=>null), claude.use("user").catch(()=>null)]);
    if(!db || !user) return;
    let uid = null; try{ uid = await user.id(); }catch(e){}
    if(!uid) return;
    store = { db, uid };
    try{
      const snap = await db.doc("data/users/"+uid+"/state").get();
      if(snap.exists){
        const remote = JSON.parse(snap.data().json || "{}");
        if(remote.setupDone){ S = migrate(Object.assign(defaults(), remote)); saveLocal(); render(); if(W && !W._chain) closeWiz(); }
      } else if(S.setupDone){ save(); }
    }catch(e){}
  })();
})();
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
